<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- viewport mobile-first: sin zoom para que el tap sea preciso -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Hopper - Aventura Sin Fin</title>

  <!-- Fuentes: Orbitron para títulos/HUD (look angular sci-fi), Rajdhani para texto chico -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #05060A;      /* negro profundo del espacio */
      --bg-nebula: #150b2e;    /* morado oscuro para el degradado de nebulosa */
      --accent-cyan: #00E5FF;  /* líneas de HUD / nave */
      --accent-pink: #FF2E92;  /* corazones / cristales de energía */
      --accent-gold: #FFD166;  /* alertas / detalles especiales */
      --text-main: #E8F1FF;
      --font-display: 'Orbitron', sans-serif;
      --font-ui: 'Rajdhani', sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      touch-action: none;
      font-family: var(--font-ui);
      color: var(--text-main);
    }

    /* Contenedor que envuelve el canvas + el marco HUD */
    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100dvh; /* dvh = dynamic viewport height: descuenta barra del navegador móvil */
      background: radial-gradient(ellipse at 50% 30%, var(--bg-nebula) 0%, var(--bg-deep) 70%);
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .hud-corner {
      position: absolute;
      width: 28px;
      height: 28px;
      border: 2px solid var(--accent-cyan);
      filter: drop-shadow(0 0 4px var(--accent-cyan));
      pointer-events: none; /* para que estos divs no bloqueen los toques del jugador */
    }
    .hud-corner.tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
    .hud-corner.tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
    .hud-corner.bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
    .hud-corner.br { bottom: 14px; right: 14px; border-left: none; border-top: none; }

    /* Línea de escaneo sutil arriba, detalle de HUD */
    .hud-label {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: var(--font-display);
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--accent-cyan);
      text-shadow: 0 0 6px var(--accent-cyan);
      opacity: 0.85;
      pointer-events: none;
      white-space: nowrap;
    }

    /* ── Capítulo 3: selector de fecha ── */
    #fecha-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(5,3,15,0.90);
      z-index: 200;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 28px;
      box-sizing: border-box;
    }
    #fecha-overlay.visible { display: flex; }
    #fecha-card {
      background: linear-gradient(150deg, rgba(40,10,70,0.97), rgba(20,5,40,0.99));
      border: 1.5px solid rgba(255,46,146,0.45);
      border-radius: 22px;
      padding: 32px 24px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 48px rgba(255,46,146,0.18), 0 8px 32px rgba(0,0,0,0.5);
    }
    #fecha-titulo {
      font-family: 'Orbitron', sans-serif;
      font-size: 19px;
      font-weight: 700;
      color: #FFFFFF;
      margin: 0 0 6px;
      line-height: 1.35;
    }
    #fecha-sub {
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      color: rgba(200,160,255,0.8);
      margin: 0 0 22px;
    }
    #fecha-input {
      width: 100%;
      padding: 14px 12px;
      border-radius: 13px;
      border: 1.5px solid rgba(255,46,146,0.55);
      background: rgba(255,255,255,0.07);
      color: #FFFFFF;
      font-family: 'Rajdhani', sans-serif;
      font-size: 19px;
      text-align: center;
      margin-bottom: 18px;
      box-sizing: border-box;
      -webkit-appearance: none;
      appearance: none;
      outline: none;
    }
    #fecha-input::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.7; }
    #fecha-btn {
      width: 100%;
      padding: 15px;
      border-radius: 13px;
      border: none;
      background: linear-gradient(135deg, #FF2E92, #C724B1);
      color: #FFFFFF;
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 22px rgba(255,46,146,0.45);
      transition: transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    #fecha-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <!-- Marco tipo "mira de cabina de nave" -->
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>
    <div class="hud-label">HOPPER EN MODO AVENTURA</div>
  </div>

  <!-- Capítulo 3: selector de fecha oficial -->
  <div id="fecha-overlay">
    <div id="fecha-card">
      <h2 id="fecha-titulo">¿Cuándo empieza nuestra historia?</h2>
      <p id="fecha-sub">Elige la fecha oficial de inicio  ❤</p>
      <input type="date" id="fecha-input">
      <button id="fecha-btn">Confirmar  ❤</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    let   ctx    = canvas.getContext('2d');
    let   dpr = 1, LW = 0, LH = 0; // dimensiones lógicas (píxeles CSS); canvas físico = LW*dpr

    // ─── CAPÍTULO 3: precarga de fotos ────────────────────────────────────────────
    const imgsCap3 = ['images/pic1.webp','images/pic2.webp','images/pic3.webp',
                      'images/pic4.webp','images/pic5.webp','images/pic6.webp']
      .map(src => { const i = new Image(); i.src = src; return i; });

    const fechaOverlay = document.getElementById('fecha-overlay');
    const fechaInput   = document.getElementById('fecha-input');
    const fechaBtn     = document.getElementById('fecha-btn');

    // ─── GRADIENT CACHE (se invalida en cada resize) ─────────────────────────── //
    let gradSkyEscena   = null;   // cielo atardecer fijo de Cap2
    let gradSueloEscena = null;   // suelo verde fijo de Cap2
    let gradHabitacion  = null;   // fondo habitación interior
    let gradVela        = null;   // glow de vela
    let gradCielo       = null;   // cielo del juego principal
    let gradCieloT      = -999;   // valor de t para el que se creó gradCielo

    function recalcularGradientes() {
      const W = LW, H = LH, horizY = H * 0.58;

      gradSkyEscena = ctx.createLinearGradient(0, 0, 0, horizY);
      gradSkyEscena.addColorStop(0,    '#18082E');
      gradSkyEscena.addColorStop(0.45, '#8B2E10');
      gradSkyEscena.addColorStop(1,    '#E87020');

      gradSueloEscena = ctx.createLinearGradient(0, horizY, 0, H);
      gradSueloEscena.addColorStop(0, '#5DA840');
      gradSueloEscena.addColorStop(1, '#2C5018');

      gradHabitacion = ctx.createLinearGradient(0, 0, 0, H);
      gradHabitacion.addColorStop(0,    '#8B3D10');
      gradHabitacion.addColorStop(0.65, '#6A2E0A');
      gradHabitacion.addColorStop(1,    '#3A1804');

      gradVela = ctx.createRadialGradient(W/2, H*0.35, 0, W/2, H*0.35, W*0.55);
      gradVela.addColorStop(0, 'rgba(255,180,60,0.40)');
      gradVela.addColorStop(1, 'rgba(0,0,0,0)');

      gradCieloT = -999; // forzar recreación del gradiente de cielo
    }

    // ─── HELPERS REUTILIZABLES ────────────────────────────────────────────────── //

    // Con canvas DPR las coords lógicas = CSS pixels; clientX/Y ya están en CSS pixels
    function getTouchPos(evento) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: evento.touches[0].clientX - rect.left,
        y: evento.touches[0].clientY - rect.top,
      };
    }

    // Hit-test de rectángulo con padding opcional
    function hitRect(tx, ty, x, y, w, h, pad = 0) {
      return tx >= x - pad && tx <= x + w + pad
          && ty >= y - pad && ty <= y + h + pad;
    }

    // Texto con glow sin tener que repetir el patrón shadowColor/shadowBlur/reset
    function glowText(text, x, y, color, blur, maxW) {
      ctx.shadowColor = color;
      ctx.shadowBlur  = blur;
      maxW != null ? ctx.fillText(text, x, y, maxW) : ctx.fillText(text, x, y);
      ctx.shadowBlur  = 0;
    }

    function ajustarTamano() {
      dpr = Math.min(window.devicePixelRatio || 1, 3);
      LW  = window.innerWidth;
      LH  = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      canvas.width  = Math.round(LW * dpr); // tamaño físico real del canvas
      canvas.height = Math.round(LH * dpr);
      canvas.style.width  = LW + 'px';
      canvas.style.height = LH + 'px';
      ctx.scale(dpr, dpr);                  // todas las coords siguen en píxeles CSS
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      generarEstrellas();
      actualizarPiso();
      recalcularGradientes();
    }

    let estrellas    = [];
    let alfaEstrellas = 0.7; // opacidad de las estrellas (se reduce durante el día)

    function generarEstrellas() {
      estrellas = [];
      const capas = [
        { cantidad: 40, velocidad: 0.3, radio: 1 },   // lejanas, lentas, chiquitas
        { cantidad: 25, velocidad: 0.8, radio: 1.5 }, // medias
        { cantidad: 12, velocidad: 1.6, radio: 2.2 }  // cercanas, rápidas, grandes
      ];

      capas.forEach(capa => {
        for (let i = 0; i < capa.cantidad; i++) {
          estrellas.push({
            x: Math.random() * LW,
            y: Math.random() * LH,
            radio: capa.radio,
            velocidad: capa.velocidad
          });
        }
      });
    }

    function dibujarEstrellas() {
      estrellas.forEach(estrella => {
        // Movemos cada estrella hacia la izquierda (sensación de vuelo hacia adelante)
        estrella.x -= estrella.velocidad;

        // Si la estrella sale por la izquierda, la reciclamos al lado derecho.
        // Esto evita crear/destruir objetos constantemente (más eficiente que
        // borrar del array y agregar uno nuevo).
        if (estrella.x < 0) {
          estrella.x = LW;
          estrella.y = Math.random() * LH;
        }

        ctx.beginPath();
        ctx.arc(estrella.x, estrella.y, estrella.radio, 0, Math.PI * 2);
        ctx.fillStyle = '#E8F1FF';
        ctx.globalAlpha = alfaEstrellas;
        ctx.fill();
        ctx.globalAlpha = 1;
      });
    }


    // ─── FÍSICA DE LA NAVE ────────────────────────────────────────────────────
    const GRAVEDAD      = 0.45;
    const IMPULSO_SALTO = -14;
    const NAVE_ANCHO    = 50;
    const NAVE_ALTO     = 28;
    const NAVE_X        = 80;

    let   pisoY = 0;
    const nave  = { y: 0, velY: 0, enPiso: true };

    function actualizarPiso() {
      pisoY = LH - 100;
      if (nave.enPiso) {
        nave.y = pisoY - NAVE_ALTO; // pegar la nave al nuevo suelo inmediatamente
      }
    }

    function actualizarFisica() {
      const prevBottom = nave.y + NAVE_ALTO; // posición inferior antes de este step

      nave.velY += GRAVEDAD * dt;
      nave.y    += nave.velY * dt;

      const currBottom = nave.y + NAVE_ALTO;

      // Plataforma (puente): detectar aterrizaje sobre la superficie superior
      let landedPlatform = false;
      for (const obs of obstaculos) {
        if (obs.tipo !== 'puente') continue;
        const aw = obs.ancho || OBS_ANCHO;
        if (NAVE_X + NAVE_ANCHO > obs.x && NAVE_X < obs.x + aw) {
          const platTop = obs.y;
          // El hopper pasó a través de la superficie esta frame, viniendo desde arriba
          if (prevBottom <= platTop + 1 && currBottom >= platTop && nave.velY >= 0) {
            nave.y      = platTop - NAVE_ALTO;
            nave.velY   = 0;
            nave.enPiso = true;
            landedPlatform = true;
            break;
          }
        }
      }

      if (!landedPlatform) {
        if (nave.y + NAVE_ALTO >= pisoY) {
          nave.y      = pisoY - NAVE_ALTO;
          nave.velY   = 0;
          nave.enPiso = true;
        } else {
          nave.enPiso = false;
        }
      }
    }

    function dibujarPiso() {
      ctx.save();

      // Tierra (franja marrón que llena el espacio bajo el pasto)
      ctx.fillStyle = '#2A1A0E';
      ctx.fillRect(0, pisoY + 10, LW, LH - pisoY);

      // Franja base de pasto
      ctx.fillStyle = '#3A6B2A';
      ctx.fillRect(0, pisoY, LW, 12);

      // Borde superior del pasto (más claro)
      ctx.fillStyle = '#4E8A38';
      ctx.fillRect(0, pisoY, LW, 5);

      // Briznas de pasto: triángulos simples a intervalos irregulares
      // Usamos frameContador para desplazarlas con el mundo (ilusión de scroll)
      const offsetX = frameContador * velocidadMundo % 18;
      ctx.fillStyle = '#62AA44';
      for (let x = -offsetX; x < LW + 18; x += 18) {
        // Brizna izquierda
        ctx.beginPath();
        ctx.moveTo(x,     pisoY + 2);
        ctx.lineTo(x + 3, pisoY - 7);
        ctx.lineTo(x + 7, pisoY + 2);
        ctx.fill();
        // Brizna derecha (más corta, variación visual)
        ctx.beginPath();
        ctx.moveTo(x + 10, pisoY + 2);
        ctx.lineTo(x + 13, pisoY - 4);
        ctx.lineTo(x + 16, pisoY + 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function dibujarCastor(x, y, velY, enPiso) {
      const cx = x + NAVE_ANCHO / 2;
      const cy = y + NAVE_ALTO / 2;
      const angulo = Math.max(-0.44, Math.min(0.44, velY * 0.04));

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angulo);

      const C1 = '#5C3D1E';
      const C2 = '#8B5E3C';
      const C3 = '#C4956A';
      const BL = '#F5F0E8';
      const NE = '#0D0800';

      const corriendo = enPiso && estadoJuego === 'JUGANDO';
      const pata = corriendo
        ? Math.sin(frameContador * 0.45) * 4
        : (velY < 0 ? -4 : 3);

      // Cola plana de castor (oval horizontal, atrás/izquierda)
      ctx.fillStyle = C1;
      ctx.beginPath();
      ctx.ellipse(-22, 7, 9, 5, 0.15, 0, Math.PI * 2);
      ctx.fill();

      // Cuerpo (oval)
      ctx.fillStyle = C2;
      ctx.beginPath();
      ctx.ellipse(-4, 1, 14, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Panza más clara
      ctx.fillStyle = C3;
      ctx.beginPath();
      ctx.ellipse(-4, 3, 8, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Pata trasera y delantera
      ctx.fillStyle = C1;
      ctx.fillRect(-12, 9, 6, 7 + pata);
      ctx.fillRect(  1, 9, 6, 7 - pata);

      // Cabeza (círculo derecho)
      ctx.fillStyle = C2;
      ctx.beginPath();
      ctx.arc(14, -3, 11, 0, Math.PI * 2);
      ctx.fill();

      // Oreja
      ctx.fillStyle = C1;
      ctx.beginPath();
      ctx.ellipse(9, -13, 5, 4, -0.3, 0, Math.PI * 2);
      ctx.fill();

      // Ojo blanco + pupila
      ctx.fillStyle = BL;
      ctx.beginPath();
      ctx.arc(19, -5, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = NE;
      ctx.beginPath();
      ctx.arc(20, -5, 1.5, 0, Math.PI * 2);
      ctx.fill();

      // Nariz
      ctx.fillStyle = C1;
      ctx.beginPath();
      ctx.ellipse(24, -1, 2.5, 2, 0, 0, Math.PI * 2);
      ctx.fill();

      // Dientes de castor (dos rectángulos con separador)
      ctx.fillStyle = BL;
      ctx.fillRect(21, 2, 3, 5);
      ctx.fillRect(25, 2, 3, 5);
      ctx.fillStyle = C3;
      ctx.fillRect(24, 2, 1, 5);

      ctx.restore();
    }

    function dibujarNave() {
      dibujarCastor(NAVE_X, nave.y, nave.velY, nave.enPiso);
    }


    // ─── CIELO DINÁMICO (DÍA / NOCHE) ────────────────────────────────────────────
    const CICLO_DURACION = 5400; // frames por ciclo (~90 seg a 60fps)

    const CIELO_KF = [
      { t: 0.00, top: [ 5,  6, 10], bot: [21, 11,  46] }, // noche
      { t: 0.15, top: [12,  5, 25], bot: [50, 18,  65] }, // noche tardía
      { t: 0.25, top: [65, 25, 20], bot: [185, 80, 40] }, // amanecer
      { t: 0.38, top: [80,130,200], bot: [160,200, 230] }, // mañana
      { t: 0.55, top: [35, 95,185], bot: [110,165, 215] }, // mediodía
      { t: 0.68, top: [75, 50, 15], bot: [210,110,  45] }, // atardecer
      { t: 0.82, top: [25,  8, 30], bot: [75, 20,  60]  }, // crepúsculo
      { t: 1.00, top: [ 5,  6, 10], bot: [21, 11,  46]  }, // noche
    ];

    function lerpRGB(c1, c2, f) {
      return [
        Math.round(c1[0] + (c2[0] - c1[0]) * f),
        Math.round(c1[1] + (c2[1] - c1[1]) * f),
        Math.round(c1[2] + (c2[2] - c1[2]) * f),
      ];
    }

    function getColorCielo(t) {
      for (let i = 0; i < CIELO_KF.length - 1; i++) {
        const k1 = CIELO_KF[i], k2 = CIELO_KF[i + 1];
        if (t >= k1.t && t <= k2.t) {
          const f   = (t - k1.t) / (k2.t - k1.t);
          const top = lerpRGB(k1.top, k2.top, f);
          const bot = lerpRGB(k1.bot, k2.bot, f);
          return {
            top: `rgb(${top[0]},${top[1]},${top[2]})`,
            bot: `rgb(${bot[0]},${bot[1]},${bot[2]})`,
          };
        }
      }
      return { top: 'rgb(5,6,10)', bot: 'rgb(21,11,46)' };
    }

    function dibujarCielo() {
      // t = posición en el ciclo. forzarAtardecer lo fija en el dorado del cap2.
      const t = forzarAtardecer ? 0.65 : (score % CICLO_DURACION) / CICLO_DURACION;

      // Estrellas: brillantes de noche, invisibles de día, transición gradual
      if      (t < 0.20) alfaEstrellas = 0.7;
      else if (t < 0.27) alfaEstrellas = 0.7 * (1 - (t - 0.20) / 0.07);
      else if (t < 0.67) alfaEstrellas = 0;
      else if (t < 0.80) alfaEstrellas = 0.7 * (t - 0.67) / 0.13;
      else               alfaEstrellas = 0.7;

      // Fondo degradado — se recrea solo cuando t cambia visualmente (dirty-check)
      const { top, bot } = getColorCielo(t);
      if (Math.abs(t - gradCieloT) > 0.004) {
        gradCielo  = ctx.createLinearGradient(0, 0, 0, LH);
        gradCielo.addColorStop(0, top);
        gradCielo.addColorStop(1, bot);
        gradCieloT = t;
      }
      ctx.fillStyle = gradCielo;
      ctx.fillRect(0, 0, LW, LH);

      // Sol — visible de t=0.20 a t=0.80, con fade en los bordes
      if (t >= 0.20 && t <= 0.80) {
        const opa  = Math.min(1, Math.min((t - 0.20) / 0.12, (0.80 - t) / 0.12));
        const prog = (t - 0.20) / 0.60; // 0 al amanecer, 1 al anochecer
        // Arco parabólico: empieza a la derecha, sube al centro, baja a la izquierda
        const solX = LW  * (0.85 - prog * 0.65);
        const solY = LH * (0.38  - 0.26 * Math.sin(prog * Math.PI));

        ctx.save();
        ctx.globalAlpha = opa;

        // Halo difuso (radial gradient)
        const halo = ctx.createRadialGradient(solX, solY, 22, solX, solY, 75);
        halo.addColorStop(0, 'rgba(255,230,100,0.45)');
        halo.addColorStop(1, 'rgba(255,200, 50, 0)');
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(solX, solY, 75, 0, Math.PI * 2);
        ctx.fill();

        // Disco solar
        ctx.shadowColor = '#FFD700';
        ctx.shadowBlur  = 20;
        ctx.fillStyle   = '#FFE055';
        ctx.beginPath();
        ctx.arc(solX, solY, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.restore();
      }
    }


    // ─── OBSTÁCULOS Y DIFICULTAD PROGRESIVA ──────────────────────────────────────
    const VEL_MUNDO_BASE = 2.5;
    const VEL_MUNDO_MAX  = 12;
    const OBS_ANCHO      = 40;  // fallback; cada obstáculo define su propio ancho

    let velocidadMundo     = VEL_MUNDO_BASE;
    let obstaculos         = [];
    let framesSiguienteObs = 190; // gracia inicial
    let ultimoTipoObs      = 'piso';

    function elegirTipoObstaculo() {
      const aéreo  = ultimoTipoObs === 'rama';
      const plataforma = ultimoTipoObs === 'puente';
      const r = Math.random();

      // Primeros segundos: solo obstáculos de piso variados
      if (velocidadMundo < 3.0) {
        if (r < 0.40) return 'piso';
        if (r < 0.65) return 'arbol';
        if (r < 0.82) return 'barda';
        return 'rio';
      }
      // Sin dos ramas/plataformas consecutivas
      if (aéreo || plataforma) {
        if (r < 0.35) return 'piso';
        if (r < 0.55) return 'arbol';
        if (r < 0.70) return 'barda';
        return 'rio';
      }
      // Mezcla completa con velocidad alta
      if (r < 0.25) return 'piso';
      if (r < 0.42) return 'arbol';
      if (r < 0.56) return 'barda';
      if (r < 0.68) return 'rio';
      if (r < 0.85) return 'rama';
      return 'puente';
    }

    function spawnObstaculo() {
      const tipo = elegirTipoObstaculo();
      ultimoTipoObs = tipo;

      if (tipo === 'piso') {
        const maxAlto = Math.min(100, 32 + velocidadMundo * 6);
        const alto    = 36 + Math.random() * (maxAlto - 36);
        obstaculos.push({ tipo, x: LW + 10, y: pisoY - alto, alto, ancho: 40 });

      } else if (tipo === 'arbol') {
        const alto  = 68 + Math.random() * 36;   // 68-104px
        obstaculos.push({ tipo, x: LW + 10, y: pisoY - alto, alto, ancho: 34 });

      } else if (tipo === 'barda') {
        const alto  = 46 + Math.random() * 22;   // 46-68px
        obstaculos.push({ tipo, x: LW + 10, y: pisoY - alto, alto, ancho: 54 });

      } else if (tipo === 'rio') {
        const alto  = 28 + Math.random() * 14;   // 28-42px — bajo pero muy ancho
        const ancho = 88 + Math.random() * 52;   // 88-140px
        obstaculos.push({ tipo, x: LW + 10, y: pisoY - alto, alto, ancho });

      } else if (tipo === 'rama') {
        const jumpHeight = (IMPULSO_SALTO * IMPULSO_SALTO) / (2 * GRAVEDAD);
        const peakNavTop = pisoY - NAVE_ALTO - jumpHeight;
        const minAlto    = peakNavTop + 28;
        const maxAlto    = pisoY - NAVE_ALTO - 28;
        const alto       = minAlto + Math.random() * (maxAlto - minAlto);
        const ancho      = 44 + Math.random() * 22;
        obstaculos.push({ tipo, x: LW + 10, y: 0, alto, ancho });

      } else if (tipo === 'puente') {
        // Plataforma elevada: el Hopper salta ENCIMA y camina sobre ella
        const platY   = pisoY - 60 - Math.random() * 12; // 60-72px sobre el piso
        const ancho   = 110 + Math.random() * 40;         // 110-150px ancho
        obstaculos.push({ tipo, x: LW + 10, y: platY, alto: 13, ancho });
      }
    }

    function actualizarObstaculos() {
      framesSiguienteObs -= dt;
      if (framesSiguienteObs <= 0) {
        spawnObstaculo();
        const base  = Math.max(34, Math.round(120 - velocidadMundo * 8));
        const extra = (ultimoTipoObs === 'rio' || ultimoTipoObs === 'puente') ? 22 : 0;
        framesSiguienteObs = base + extra + Math.floor(Math.random() * 32);
      }

      for (let i = obstaculos.length - 1; i >= 0; i--) {
        obstaculos[i].x -= velocidadMundo * dt;
        if (obstaculos[i].x + (obstaculos[i].ancho || OBS_ANCHO) < 0) obstaculos.splice(i, 1);
      }
    }

    function dibujarObstaculos() {
      obstaculos.forEach(obs => {
        const aw = obs.ancho || OBS_ANCHO;
        ctx.save();

        if (obs.tipo === 'piso') {
          // Tronco caído con veta de madera
          ctx.fillStyle = '#7A4418';
          ctx.fillRect(obs.x, obs.y, aw, obs.alto);
          ctx.fillStyle = '#C88040';
          ctx.beginPath(); ctx.ellipse(obs.x + aw / 2, obs.y + 5, aw * 0.38, 5, 0, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#5A3010'; ctx.lineWidth = 1.5;
          for (let i = 1; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(obs.x + 4, obs.y + (obs.alto / 4) * i);
            ctx.lineTo(obs.x + aw - 4, obs.y + (obs.alto / 4) * i);
            ctx.stroke();
          }

        } else if (obs.tipo === 'arbol') {
          // Árbol: tronco + copa verde
          const tW = 13, tX = obs.x + (aw - tW) / 2;
          ctx.fillStyle = '#6B4226'; ctx.shadowColor = '#3E2010'; ctx.shadowBlur = 6;
          ctx.fillRect(tX, obs.y + obs.alto * 0.48, tW, obs.alto * 0.52);
          const cR = aw * 0.78, cY = obs.y + obs.alto * 0.38;
          ctx.fillStyle = '#2E7D32'; ctx.shadowColor = '#1B5E20'; ctx.shadowBlur = 12;
          ctx.beginPath(); ctx.arc(obs.x + aw / 2, cY, cR, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#43A047';
          ctx.beginPath(); ctx.arc(obs.x + aw / 2 - 7, cY + 9, cR * 0.62, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(obs.x + aw / 2 + 7, cY + 7, cR * 0.58, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;

        } else if (obs.tipo === 'barda') {
          // Barda de madera: postes + rieles
          ctx.fillStyle = '#A0722A';
          ctx.fillRect(obs.x, obs.y + obs.alto * 0.22, aw, 5);
          ctx.fillRect(obs.x, obs.y + obs.alto * 0.52, aw, 5);
          ctx.fillRect(obs.x, obs.y + obs.alto * 0.82, aw, 5);
          const nPosts = Math.max(3, Math.round(aw / 14));
          for (let i = 0; i < nPosts; i++) {
            const px = obs.x + (i / (nPosts - 1)) * (aw - 8);
            ctx.fillRect(px, obs.y, 8, obs.alto);
          }

        } else if (obs.tipo === 'rio') {
          // Río: agua con olas animadas
          ctx.fillStyle = '#1565C0'; ctx.shadowColor = '#0D47A1'; ctx.shadowBlur = 10;
          ctx.fillRect(obs.x, obs.y, aw, obs.alto);
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#42A5F5';
          ctx.fillRect(obs.x, obs.y, aw, obs.alto * 0.38);
          // Olas animadas
          ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.8;
          const offset = (frameContador * 0.5) % 18;
          for (let i = -1; i <= Math.ceil(aw / 18) + 1; i++) {
            const wx = obs.x + i * 18 - offset;
            if (wx + 10 < obs.x || wx > obs.x + aw) continue;
            ctx.beginPath();
            ctx.moveTo(wx, obs.y + obs.alto * 0.58);
            ctx.quadraticCurveTo(wx + 5, obs.y + obs.alto * 0.35, wx + 10, obs.y + obs.alto * 0.58);
            ctx.stroke();
          }

        } else if (obs.tipo === 'rama') {
          // Rama del techo con hojas colgantes
          ctx.fillStyle = '#5D4037';
          ctx.fillRect(obs.x, obs.y, aw, obs.alto);
          ctx.strokeStyle = '#4E342E'; ctx.lineWidth = 1.5;
          for (let i = 1; i < 3; i++) {
            ctx.beginPath();
            ctx.moveTo(obs.x + 4, obs.y + (obs.alto / 3) * i);
            ctx.lineTo(obs.x + aw - 4, obs.y + (obs.alto / 3) * i + 3);
            ctx.stroke();
          }
          // Hojas en el borde inferior
          ctx.fillStyle = '#388E3C';
          const leafY = obs.y + obs.alto;
          for (let i = 0; i < 5; i++) {
            const lx = obs.x + (i / 4) * (aw - 14) + 7;
            const lr = 8 + Math.sin(i * 1.3) * 3;
            ctx.beginPath(); ctx.arc(lx, leafY + lr * 0.45, lr, 0, Math.PI * 2); ctx.fill();
          }

        } else if (obs.tipo === 'puente') {
          // Puente elevado: pilares + tablones
          ctx.fillStyle = '#6D4C41';
          const pilW = 8, pilH = pisoY - obs.y - obs.alto;
          ctx.fillRect(obs.x + 10,        obs.y + obs.alto, pilW, pilH);
          ctx.fillRect(obs.x + aw - 18,   obs.y + obs.alto, pilW, pilH);
          if (aw > 80) ctx.fillRect(obs.x + aw / 2 - 4, obs.y + obs.alto, pilW, pilH);
          // Tablones
          ctx.fillStyle = '#A1887F';
          ctx.fillRect(obs.x, obs.y, aw, obs.alto);
          ctx.strokeStyle = '#6D4C41'; ctx.lineWidth = 1.5;
          for (let px = obs.x + 14; px < obs.x + aw; px += 14) {
            ctx.beginPath(); ctx.moveTo(px, obs.y); ctx.lineTo(px, obs.y + obs.alto); ctx.stroke();
          }
          // Borde superior (barandal)
          ctx.strokeStyle = '#8D6E63'; ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.moveTo(obs.x, obs.y - 1); ctx.lineTo(obs.x + aw, obs.y - 1); ctx.stroke();
        }

        ctx.restore();
      });
    }

    const MARGEN_HITBOX = 4;

    function detectarColision() {
      const nX = NAVE_X     + MARGEN_HITBOX;
      const nY = nave.y     + MARGEN_HITBOX;
      const nW = NAVE_ANCHO - MARGEN_HITBOX * 2;
      const nH = NAVE_ALTO  - MARGEN_HITBOX * 2;

      for (const obs of obstaculos) {
        if (obs.tipo === 'puente') continue; // el puente usa física de plataforma, no colisión mortal
        const aw   = obs.ancho || OBS_ANCHO;
        const sepX = nX + nW < obs.x  ||  nX > obs.x + aw;
        const sepY = nY + nH < obs.y  ||  nY > obs.y + obs.alto;
        if (!sepX && !sepY) return true;
      }
      return false;
    }

    // Dibuja texto siempre dentro del ancho seguro (sin squish excesivo, solo si rebasa)
    function safeText(text, x, y, maxW) {
      const mw = maxW ?? SAFE_W();
      ctx.fillText(text, x, y, mw);
    }

    // ─── DRAWING — GAME STATES ────────────────────────────────────────────────── //

    function dibujarGameOver() {
      ctx.save();

      // Sacudida de pantalla al morir
      if (screenShake > 0) {
        const sx = (Math.random() - 0.5) * screenShake * 3;
        const sy = (Math.random() - 0.5) * screenShake * 3;
        ctx.translate(sx, sy);
        screenShake = Math.max(0, screenShake - 0.6 * dt);
      }

      ctx.fillStyle = 'rgba(5, 6, 10, 0.82)';
      ctx.fillRect(-20, -20, LW + 40, LH + 40);

      const cx = LW  / 2;
      const cy = LH / 2;
      ctx.textAlign = 'center';

      // Flash rojo al momento de morir
      const flashA = Math.max(0, 1 - frameContador * 0.04);
      if (flashA > 0) {
        ctx.globalAlpha = flashA * 0.35;
        ctx.fillStyle   = '#FF2E92';
        ctx.fillRect(-20, -20, LW + 40, LH + 40);
        ctx.globalAlpha = 1;
      }

      ctx.font        = '700 22px "Orbitron", sans-serif';
      ctx.fillStyle   = '#FF2E92';
      ctx.shadowColor = '#FF2E92';
      ctx.shadowBlur  = 20;
      safeText('TU HOPPER FUE DESTRUIDO', cx, cy - 38);

      ctx.font        = '900 36px "Orbitron", sans-serif';
      ctx.fillStyle   = '#FFD166';
      ctx.shadowColor = '#FFD166';
      ctx.shadowBlur  = 14;
      safeText(Math.floor(score) + ' m', cx, cy + 14);

      const blinkA = 0.55 + 0.45 * Math.sin(frameContador * 0.09);
      ctx.globalAlpha = blinkA;
      ctx.font        = '600 19px "Rajdhani", sans-serif';
      ctx.fillStyle   = '#E8F1FF';
      ctx.shadowBlur  = 0;
      safeText('TOCA PARA REINICIAR', cx, cy + 56);
      ctx.globalAlpha = 1;

      ctx.restore();
    }

    function reiniciarJuego() {

    // ─── CAPÍTULO 2 — FUNCIONES ──────────────────────────────────────────────────
    function reposicionarNo() {
      const cx = LW / 2, cy = LH / 2;
      const nW = 110, nH = 48;
      let nx, ny, intentos = 0;
      const siCX = cx, siCY = cy + 46;
      do {
        nx = 40 + Math.random() * (LW - nW - 80);
        ny = cy + 8  + Math.random() * (LH * 0.30);
        intentos++;
      } while (intentos < 20
        && Math.abs((nx + nW/2) - siCX) < 140
        && Math.abs((ny + nH/2) - siCY) < 75);
      btnNoPosX = nx;
      btnNoPosY = ny;
    }

    function formatearFecha(s) {
      if (!s) return { dia: '—', mes: '', anio: '' };
      const [y, m, d] = s.split('-');
      const meses = ['enero','febrero','marzo','abril','mayo','junio',
                     'julio','agosto','septiembre','octubre','noviembre','diciembre'];
      return { dia: String(parseInt(d)), mes: 'de ' + meses[parseInt(m) - 1], anio: 'de ' + y };
    }

    async function guardarFotoFinal() {
      try {
        // Canvas ya es DPR-nativo; toBlob captura a resolución física completa
        const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
        const file = new File([blob], 'hopper-elena-y-alex.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Elena ❤ Alex', text: '¡Oficialmente novios!' });
        } else {
          const url = URL.createObjectURL(blob);
          const a   = document.createElement('a');
          a.href = url; a.download = 'hopper-elena-y-alex.png'; a.click();
          setTimeout(() => URL.revokeObjectURL(url), 3000);
        }
      } catch (e) {
        // El usuario canceló el share — no hacer nada
      }
    }

    // Dibuja a Hopper centrado en (cx, cy) con escala arbitraria
    function dibujarCastorEn3D(cx, cy, escala, velY, enPiso) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(escala, escala);
      dibujarCastor(-NAVE_ANCHO / 2, -NAVE_ALTO / 2, velY, enPiso);

    // ─── DRAWING — CHARACTERS & SCENES ───────────────────────────────────────── //

    // Elena: Hopper con lazo rosa
    function dibujarElena(cx, cy, escala) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(escala, escala);
      dibujarCastor(-NAVE_ANCHO / 2, -NAVE_ALTO / 2, 0, true);
      ctx.fillStyle = '#FF2E92';
      ctx.beginPath(); ctx.moveTo(-7, -23); ctx.lineTo(-2, -19); ctx.lineTo(-7, -15); ctx.fill();
      ctx.beginPath(); ctx.moveTo( 3, -23); ctx.lineTo(-2, -19); ctx.lineTo( 3, -15); ctx.fill();
      ctx.fillStyle = '#FF6BAD';
      ctx.beginPath(); ctx.arc(-2, -19, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // Fondo: sendero en perspectiva con atardecer
    function dibujarEscenaCamino() {
      const vpX      = LW / 2;
      const horizonY = LH * 0.58;

      ctx.fillStyle = gradSkyEscena;
      ctx.fillRect(0, 0, LW, horizonY);

      ctx.save();
      ctx.shadowColor = '#FFD166'; ctx.shadowBlur = 45;
      ctx.fillStyle   = '#FFE566';
      ctx.beginPath(); ctx.arc(vpX, horizonY, 22, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0; ctx.restore();

      ctx.fillStyle = gradSueloEscena;
      ctx.fillRect(0, horizonY, LW, LH - horizonY);

      // Sendero de tierra (trapecio perspectiva)
      ctx.fillStyle = '#A0825A';
      ctx.beginPath();
      ctx.moveTo(LW * 0.08, LH);
      ctx.lineTo(LW * 0.92, LH);
      ctx.lineTo(vpX + 14, horizonY + 1);
      ctx.lineTo(vpX - 14, horizonY + 1);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#8B6B45'; ctx.lineWidth = 1;
      for (let i = 1; i <= 8; i++) {
        const t  = i / 9;
        const yp = horizonY + (LH - horizonY) * (t * t);
        const hw = (LW * 0.42) * (t * t);
        ctx.globalAlpha = t * 0.5;
        ctx.beginPath(); ctx.moveTo(vpX - hw, yp); ctx.lineTo(vpX + hw, yp); ctx.stroke();
      }
      ctx.globalAlpha = 1; ctx.lineWidth = 1;

      // Árboles laterales
      for (let i = 0; i < 5; i++) {
        const t   = (i + 1) / 6.5;
        const ty  = horizonY + (LH - horizonY) * (t * t);
        const th  = 55 * t, tw = 9 * t;
        const pad = (LW * 0.42) * (t * t) + 12 * t;
        ctx.fillStyle = '#3D2008';
        ctx.fillRect(vpX - pad - tw, ty - th, tw, th);
        ctx.fillStyle = '#2E6020';
        ctx.beginPath(); ctx.arc(vpX - pad - tw * 0.5, ty - th, tw * 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#3D2008';
        ctx.fillRect(vpX + pad, ty - th, tw, th);
        ctx.fillStyle = '#2E6020';
        ctx.beginPath(); ctx.arc(vpX + pad + tw * 0.5, ty - th, tw * 2.2, 0, Math.PI * 2); ctx.fill();
      }
    }

    // Casa pequeña con puerta animada y Elena saliendo
    function dibujarCasaConPuerta(doorProgress) {
      const vpX      = LW  / 2;
      const horizonY = LH * 0.58;
      const ESC      = 0.72;
      const casaW    = 72 * ESC, casaH = 66 * ESC;
      const baseY    = horizonY + 1;

      ctx.fillStyle = '#D4B896';
      ctx.fillRect(vpX - casaW / 2, baseY - casaH, casaW, casaH);

      ctx.fillStyle = '#6B3A1E';
      ctx.beginPath();
      ctx.moveTo(vpX - casaW / 2 - 4 * ESC, baseY - casaH);
      ctx.lineTo(vpX, baseY - casaH - 30 * ESC);
      ctx.lineTo(vpX + casaW / 2 + 4 * ESC, baseY - casaH);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#F0D890';
      ctx.fillRect(vpX + 8 * ESC, baseY - casaH + 11 * ESC, 15 * ESC, 12 * ESC);
      ctx.strokeStyle = '#8B5E3C'; ctx.lineWidth = 1;
      ctx.strokeRect(vpX + 8 * ESC, baseY - casaH + 11 * ESC, 15 * ESC, 12 * ESC);

      const dW = 22 * ESC, dH = 38 * ESC;
      const dX = vpX - dW / 2, dY = baseY - dH;
      // Interior: oscuro si cerrada, cálido y con detalles si se abre
      if (doorProgress > 0) {
        const iGrad = ctx.createLinearGradient(dX, dY, dX + dW, dY + dH);
        iGrad.addColorStop(0, '#C86820');
        iGrad.addColorStop(1, '#6A3010');
        ctx.fillStyle = iGrad;
        ctx.fillRect(dX, dY, dW, dH);
        ctx.fillStyle = '#5C3010';
        ctx.fillRect(dX, dY + dH * 0.72, dW, dH * 0.28);
        ctx.fillStyle = 'rgba(255,200,80,0.35)';
        ctx.fillRect(dX + dW * 0.55, dY + dH * 0.15, dW * 0.38, dH * 0.28);
      } else {
        ctx.fillStyle = '#1A0808';
        ctx.fillRect(dX, dY, dW, dH);
      }

      if (doorProgress < 1) {
        const visW = dW * (1 - doorProgress * 0.92);
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(dX, dY, visW, dH);
        ctx.fillStyle = '#FFD166';
        ctx.beginPath(); ctx.arc(dX + visW - 3 * ESC, dY + dH * 0.55, 2 * ESC, 0, Math.PI * 2); ctx.fill();
      }

    }

    function dibujarTocaContinuar() {
      const pulso = 0.50 + 0.50 * Math.sin(frameContador * 0.09);
      ctx.save();
      ctx.globalAlpha = pulso;
      ctx.textAlign   = 'center';
      ctx.font        = '600 19px "Rajdhani", sans-serif';
      ctx.fillStyle   = '#E8F1FF';
      ctx.shadowColor = 'rgba(200,220,255,0.8)';
      ctx.shadowBlur  = 10;
      ctx.fillText('✦  TOCA PARA CONTINUAR  ✦', LW / 2, LH - 48);
      ctx.shadowBlur  = 0;
      ctx.restore();
    }

    function dibujarCloseUpPuerta(f) {
      const W   = LW;
      const H   = LH;
      const cxP = W / 2;

      // ── Fases del close-up (f relativo a cap2Frame - 240) ──
      const KNOCK_END  = 70;   // fin del toc toc
      const DOOR_END   = 160;  // puerta completamente abierta
      const FADE_INT   = 195;  // empieza cross-fade a interior
      const INT_FULL   = 235;  // interior completamente visible
      const TAP_READY  = 295;  // aparece TOCA PARA CONTINUAR (antes del DIALOGO_PREVIO)

      const doorOpen  = f >= KNOCK_END ? Math.min(1, (f - KNOCK_END) / (DOOR_END  - KNOCK_END)) : 0;
      const enterT    = f >= DOOR_END  ? Math.min(1, (f - DOOR_END)  / (FADE_INT  - DOOR_END))  : 0;
      const intAlpha  = f >= FADE_INT  ? Math.min(1, (f - FADE_INT)  / (INT_FULL  - FADE_INT))  : 0;
      const extAlpha  = f < FADE_INT   ? 1 : Math.max(0, 1 - (f - FADE_INT) / 40);
      const fadein    = Math.min(1, f / 20);

      // dimensiones del panel de puerta (exterior)
      const pH = H * 0.68;
      const pW = Math.min(W * 0.78, pH * 0.62);
      const pX = cxP - pW / 2;
      const pY = H * 0.12;

      ctx.save();
      ctx.textAlign = 'center';

      // ═══════════════════════════════════════════
      //  EXTERIOR — close-up de la puerta
      // ═══════════════════════════════════════════
      if (extAlpha > 0) {
        // overlay oscuro
        ctx.globalAlpha = fadein * 0.95 * extAlpha;
        ctx.fillStyle   = '#0A0514';
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = fadein * extAlpha;

        // marco de la puerta
        ctx.fillStyle = '#5A3008';
        ctx.beginPath(); ctx.roundRect(pX - 14, pY - 10, pW + 28, pH + 20, 6); ctx.fill();

        // interior cálido (se revela al abrirse)
        if (doorOpen > 0) {
          const ig = ctx.createLinearGradient(pX, pY, pX + pW, pY + pH);
          ig.addColorStop(0, '#C86820'); ig.addColorStop(1, '#6A3010');
          ctx.fillStyle = ig;
          ctx.beginPath(); ctx.roundRect(pX, pY, pW, pH, 4); ctx.fill();
          ctx.fillStyle = '#5C3010';
          ctx.fillRect(pX, pY + pH * 0.72, pW, pH * 0.28);
          if (doorOpen > 0.25) {
            ctx.save();
            ctx.globalAlpha *= Math.min(1, (doorOpen - 0.25) / 0.5);
            ctx.fillStyle = 'rgba(255,210,90,0.38)';
            ctx.fillRect(pX + pW * 0.55, pY + pH * 0.14, pW * 0.30, pH * 0.26);
            ctx.restore();
          }
          // Elena asomándose cuando la puerta está bastante abierta
          if (doorOpen > 0.60) {
            ctx.save();
            ctx.globalAlpha *= Math.min(1, (doorOpen - 0.60) / 0.40);
            dibujarElena(pX + pW * 0.68, pY + pH * 0.74, 0.92);
            ctx.restore();
          }
          if (doorOpen > 0.78) {
            ctx.save();
            ctx.globalAlpha *= Math.min(1, (doorOpen - 0.78) / 0.22);
            ctx.font = '700 20px "Orbitron", sans-serif';
            ctx.fillStyle = '#FFE8F5'; ctx.shadowColor = '#FF2E92'; ctx.shadowBlur = 14;
            ctx.fillText('¡Alex!', cxP, pY - 20);
            ctx.shadowBlur = 0;
            ctx.restore();
          }
        }

        // panel de puerta (se aplasta hacia la izquierda al abrirse)
        if (doorOpen < 1) {
          const dW = pW * (1 - doorOpen * 0.93);
          ctx.save();
          const dg = ctx.createLinearGradient(pX, 0, pX + dW, 0);
          dg.addColorStop(0, '#7A4010'); dg.addColorStop(0.5, '#A85C20'); dg.addColorStop(1, '#6A380C');
          ctx.fillStyle = dg;
          ctx.beginPath(); ctx.roundRect(pX, pY, dW, pH, 4); ctx.fill();
          ctx.fillStyle = '#FFCC44'; ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 6;
          ctx.beginPath(); ctx.arc(pX + dW * 0.72, pY + pH * 0.52, 7, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.roundRect(pX + 14, pY + 14,      dW - 28, pH * 0.38, 3); ctx.stroke();
          ctx.beginPath(); ctx.roundRect(pX + 14, pY + pH * 0.48, dW - 28, pH * 0.35, 3); ctx.stroke();
          ctx.restore();
        }

        // Hopper en la puerta (golpea → entra)
        const hopX    = pX - 18 + (pX + pW * 0.22 - (pX - 18)) * enterT;
        const kBounce = f < KNOCK_END ? Math.abs(Math.sin(f * 0.20)) * 14 : 0;
        ctx.save();
        ctx.translate(hopX, pY + pH * 0.73 - kBounce);
        ctx.globalAlpha *= 1 - enterT * 0.55;
        ctx.scale(1.12, 1.12);
        dibujarCastor(-NAVE_ANCHO / 2, -NAVE_ALTO / 2, 0, true);
        ctx.restore();

        // estrellas de impacto (blink lento: cada 28 frames)
        if (f < KNOCK_END && Math.floor(f / 28) % 2 === 0 && f > 6) {
          const sX = pX + 22, sY = pY + pH * 0.43;
          const pulse = 1 + 0.28 * Math.sin(f * 0.20);
          ctx.save();
          ctx.strokeStyle = '#FFEE44'; ctx.lineWidth = 2.2;
          for (let i = 0; i < 8; i++) {
            const ang = (i / 8) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(sX + Math.cos(ang) * 7  * pulse, sY + Math.sin(ang) * 7  * pulse);
            ctx.lineTo(sX + Math.cos(ang) * 18 * pulse, sY + Math.sin(ang) * 18 * pulse);
            ctx.stroke();
          }
          ctx.fillStyle = '#FFEE44';
          ctx.beginPath(); ctx.arc(sX, sY, 4, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }

        // TOC TOC text (blink lento: cada 28 frames)
        if (f < KNOCK_END) {
          const blink = Math.floor(f / 28) % 2 === 0;
          ctx.save();
          ctx.globalAlpha = fadein * extAlpha * (blink ? 0.95 : 0.18);
          ctx.font = '700 22px "Orbitron", sans-serif';
          ctx.fillStyle = '#FFD166'; ctx.shadowColor = '#FFD166'; ctx.shadowBlur = 18;
          ctx.fillText('¡TOC  TOC!', cxP, pY - 20);
          ctx.shadowBlur = 0;
          ctx.restore();
        }
      } // fin extAlpha

      // ═══════════════════════════════════════════
      //  INTERIOR — Hopper y Elena adentro de la casa
      // ═══════════════════════════════════════════
      if (f >= FADE_INT) {
        ctx.save();
        ctx.globalAlpha = intAlpha;

        // fondo de la habitación (gradiente cacheado)
        ctx.fillStyle = gradHabitacion;
        ctx.fillRect(0, 0, W, H);

        // piso de madera
        ctx.fillStyle = '#3A1A06';
        ctx.fillRect(0, H * 0.70, W, H * 0.30);
        ctx.strokeStyle = '#2A1004'; ctx.lineWidth = 1.5;
        for (let i = 1; i < 6; i++) {
          ctx.beginPath();
          ctx.moveTo(0, H * 0.70 + (i / 6) * H * 0.30);
          ctx.lineTo(W, H * 0.70 + (i / 6) * H * 0.30);
          ctx.stroke();
        }

        // brillo de vela (gradiente cacheado)
        ctx.fillStyle = gradVela;
        ctx.fillRect(0, 0, W, H);

        // ventana
        ctx.fillStyle = 'rgba(255,200,80,0.28)';
        ctx.fillRect(W * 0.72, H * 0.18, W * 0.18, H * 0.22);
        ctx.strokeStyle = '#6A3010'; ctx.lineWidth = 4;
        ctx.strokeRect(W * 0.72, H * 0.18, W * 0.18, H * 0.22);
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(W * 0.72 + W * 0.09, H * 0.18); ctx.lineTo(W * 0.72 + W * 0.09, H * 0.40); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(W * 0.72, H * 0.29); ctx.lineTo(W * 0.90, H * 0.29); ctx.stroke();

        const ESC = 1.30;
        const charY = H * 0.70;

        // Hopper (izquierda, mirando a Elena)
        dibujarCastorEn3D(cxP - 52, charY, ESC, 0, true);

        // Elena (derecha, girada a la izquierda para mirar a Hopper)
        ctx.save();
        ctx.translate(cxP + 52, charY);
        ctx.scale(-ESC, ESC);
        dibujarCastor(-NAVE_ANCHO / 2, -NAVE_ALTO / 2, 0, true);
        ctx.fillStyle = '#FF2E92';
        ctx.beginPath(); ctx.moveTo(-7,-23); ctx.lineTo(-2,-19); ctx.lineTo(-7,-15); ctx.fill();
        ctx.beginPath(); ctx.moveTo( 3,-23); ctx.lineTo(-2,-19); ctx.lineTo( 3,-15); ctx.fill();
        ctx.fillStyle = '#FF6BAD';
        ctx.beginPath(); ctx.arc(-2, -19, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        // corazón pulsante entre ellos
        if (f >= INT_FULL + 15) {
          const hp = 1 + 0.14 * Math.sin(frameContador * 0.14);
          ctx.globalAlpha = intAlpha * Math.min(1, (f - INT_FULL - 15) / 40);
          ctx.font = `${Math.round(22 * hp)}px serif`;
          ctx.fillText('❤', cxP, charY - ESC * NAVE_ALTO - 14);
          ctx.globalAlpha = intAlpha;
        }

        // "¡Alex! ¿Qué haces aquí...?" — reacción de Elena
        if (f >= INT_FULL) {
          const reactA = Math.min(1, (f - INT_FULL) / 45);
          ctx.globalAlpha = intAlpha * reactA;
          ctx.font = '600 24px "Rajdhani", sans-serif';
          ctx.fillStyle = '#FFE8F5'; ctx.shadowColor = '#FF2E92'; ctx.shadowBlur = 10;
          safeText('¡Alex! ¿Qué haces aquí...?', cxP, H * 0.14);
          ctx.shadowBlur = 0;
        }

        // "tengo algo que decirte..." — aparece después de la reacción
        if (f >= INT_FULL + 55) {
          const subA = Math.min(1, (f - INT_FULL - 55) / 40);
          ctx.globalAlpha = intAlpha * subA;
          ctx.font = '500 18px "Rajdhani", sans-serif';
          ctx.fillStyle = 'rgba(200,160,255,0.85)';
          safeText('tengo algo que decirte...', cxP, H * 0.21);
        }

        ctx.globalAlpha = intAlpha;
        ctx.restore(); // end intAlpha block

        // TOCA PARA CONTINUAR
        if (f >= TAP_READY) dibujarTocaContinuar();
      }

      ctx.restore(); // main save
    }

    function actualizarCapitulo2() {
      cap2Frame += dt;

      // INTRO_CORRE: hopper corre tras el tap, no avanza solo
      if (estadoCap2 === 'INTRO_CORRE') {
        cap2BeaverX += velocidadMundo * 2.0 * dt;
        if (cap2BeaverX > LW + NAVE_ANCHO + 20) {
          estadoCap2 = 'FADE';
          cap2Frame  = 0;
        }
      }

      if (estadoCap2 === 'FADE') {
        if (cap2Frame > 55) {
          estadoCap2 = 'CAMINO';
          cap2Frame  = 0;
        }
      }

      // CAMINO no auto-avanza; el tap lo lleva a PROPUESTA_BOTONES cuando la propuesta ya apareció

      if (estadoCap2 === 'CELEBRACION') {
        corazones.forEach(c => {
          c.y += c.vel * dt;
          c.x += Math.sin(frameContador * 0.06 + c.swing) * 0.8 * dt;
          if (c.y > LH + 40) { c.y = -40; c.x = Math.random() * LW; }
        });
        if (cap2Frame > 280) iniciarCapitulo3();
      }
    }

    function dibujarCapitulo2() {
      const cx       = LW  / 2;
      const cy       = LH / 2;
      const horizonY = LH * 0.58;
      ctx.save();
      ctx.textAlign = 'center';

      // ── INTRO: hopper quieto, texto aparece, espera tap ──
      if (estadoCap2 === 'INTRO') {
        dibujarCastor(cap2BeaverX, pisoY - NAVE_ALTO, 0, true);

        const a1 = Math.min(1, cap2Frame / 45);
        ctx.globalAlpha = a1;
        ctx.font        = '700 40px "Orbitron", sans-serif';
        ctx.fillStyle   = '#FFD166';
        ctx.shadowColor = '#FFD166'; ctx.shadowBlur = 22;
        ctx.fillText('Elena...', cx, cy - 32);
        ctx.shadowBlur  = 0;

        if (cap2Frame > 75) {
          ctx.globalAlpha = Math.min(1, (cap2Frame - 75) / 45);
          ctx.font        = '500 24px "Rajdhani", sans-serif';
          ctx.fillStyle   = '#E8F1FF';
          ctx.fillText('tengo algo que decirte...', cx, cy + 22);
        }

        ctx.globalAlpha = 1;
        if (cap2Frame >= 130) dibujarTocaContinuar();

      // ── INTRO_CORRE: hopper sale corriendo tras el tap ──
      } else if (estadoCap2 === 'INTRO_CORRE') {
        dibujarCastor(cap2BeaverX, pisoY - NAVE_ALTO, 3, false);

        if (cap2BeaverX > LW - 80) {
          ctx.globalAlpha = Math.min(1, (cap2BeaverX - (LW - 80)) / 80);
          ctx.fillStyle   = '#000';
          ctx.fillRect(0, 0, LW, LH);
        }

      // ── FADE: transición a negro → nueva escena ──
      } else if (estadoCap2 === 'FADE') {
        const p = Math.min(1, cap2Frame / 55);
        if (p < 0.40) {
          ctx.globalAlpha = 1;
          ctx.fillStyle   = '#000';
          ctx.fillRect(0, 0, LW, LH);
        } else {
          dibujarEscenaCamino();
          ctx.globalAlpha = 1 - (p - 0.40) / 0.60;
          ctx.fillStyle   = '#000';
          ctx.fillRect(0, 0, LW, LH);
        }

      // ── CAMINO: cinemática 3D automática ──
      } else if (estadoCap2 === 'CAMINO') {
        dibujarEscenaCamino();
        dibujarCasaConPuerta(0);

        const hopperT    = Math.min(1, cap2Frame / 240);
        const hopperCanY = LH * 0.84 - (LH * 0.84 - horizonY - 28) * hopperT;
        const hopperEsc  = (1 - hopperT * 0.74) * 1.5;

        if (hopperT < 1) {
          const bob = Math.sin(frameContador * 0.35) * 2;
          dibujarCastorEn3D(cx - 5, hopperCanY + bob, hopperEsc, 0, true);
        }

        if (cap2Frame < 28) {
          ctx.save();
          ctx.globalAlpha = 1 - cap2Frame / 28;
          ctx.fillStyle   = '#000';
          ctx.fillRect(0, 0, LW, LH);
          ctx.restore();
        }

        // close-up de toc toc cuando Hopper llega a la puerta
        if (cap2Frame >= 240) {
          dibujarCloseUpPuerta(cap2Frame - 240);
        }

        ctx.globalAlpha = 1;

      // ── DIALOGO_PREVIO: "Me la he pasado increíble..." ──
      } else if (estadoCap2 === 'DIALOGO_PREVIO') {
        dibujarEscenaCamino();

        const ESC = 0.43;
        const bop = Math.abs(Math.sin(cap2Frame * 0.06)) * 4;
        dibujarCastorEn3D(cx - 22, horizonY + 14 - bop, ESC, 0, true);
        dibujarElena(    cx + 22, horizonY + 14,         ESC);

        const fi = Math.min(1, cap2Frame / 55);
        ctx.globalAlpha = fi;

        // Tarjeta de diálogo
        const cardW = LW - 48;
        const cardX = 24;
        const cardY = cy - 175;
        const cardH = 168;
        ctx.fillStyle   = 'rgba(8,4,22,0.82)';
        ctx.strokeStyle = 'rgba(255,209,102,0.38)';
        ctx.lineWidth   = 1.5;
        ctx.beginPath(); ctx.roundRect(cardX, cardY, cardW, cardH, 18); ctx.fill(); ctx.stroke();

        // Pequeña línea decorativa superior
        ctx.strokeStyle = 'rgba(255,209,102,0.22)';
        ctx.lineWidth   = 1;
        ctx.beginPath();
        ctx.moveTo(cardX + 24, cardY + 18); ctx.lineTo(cardX + cardW - 24, cardY + 18);
        ctx.stroke();

        // Texto línea 1
        ctx.font      = '600 26px "Rajdhani", sans-serif';
        ctx.fillStyle = '#E8F1FF';
        ctx.textAlign = 'center';
        ctx.fillText('Me la he pasado increíble', cx, cardY + 50);

        // Texto línea 2
        ctx.fillText('contigo este último mes,', cx, cardY + 84);

        // Separación y línea 3 en dorado
        ctx.font      = '600 26px "Rajdhani", sans-serif';
        ctx.fillStyle = '#FFD166';
        ctx.shadowColor = '#FFD166'; ctx.shadowBlur = 10;
        ctx.fillText('y quería preguntarte algo...', cx, cardY + 124);
        ctx.shadowBlur = 0;

        // Atribución
        ctx.font      = '400 15px "Rajdhani", sans-serif';
        ctx.fillStyle = 'rgba(200,160,255,0.65)';
        ctx.textAlign = 'right';
        ctx.fillText('— Alex  🦫', cardX + cardW - 18, cardY + cardH - 12);
        ctx.textAlign = 'center';

        // Botón Continuar (aparece después de 80 frames)
        if (cap2Frame > 80) {
          const btnAlpha = Math.min(1, (cap2Frame - 80) / 30);
          ctx.globalAlpha = fi * btnAlpha;
          const btnW = 190, btnH = 56;
          const btnX = cx - btnW / 2, btnY = LH * 0.73;
          const pulso = 0.88 + 0.12 * Math.sin(frameContador * 0.1);
          ctx.shadowColor = '#FF2E92'; ctx.shadowBlur = 20 * pulso;
          ctx.fillStyle   = '#FF2E92';
          ctx.beginPath(); ctx.roundRect(btnX, btnY, btnW, btnH, 14); ctx.fill();
          ctx.shadowBlur  = 0;
          ctx.font        = '700 21px "Orbitron", sans-serif';
          ctx.fillStyle   = '#FFFFFF';
          ctx.fillText('Continuar  ›', cx, btnY + 35);
        }

        ctx.globalAlpha = 1;

      // ── PROPUESTA_BOTONES: SÍ y NO ──
      } else if (estadoCap2 === 'PROPUESTA_BOTONES') {
        dibujarEscenaCamino();

        const ESC = 0.43;
        const bop = Math.abs(Math.sin(cap2Frame * 0.06)) * 4;
        dibujarCastorEn3D(cx - 22, horizonY + 14 - bop, ESC, 0, true);
        dibujarElena(    cx + 22, horizonY + 14,         ESC);

        ctx.font        = '700 28px "Orbitron", sans-serif';
        ctx.fillStyle   = '#FFD166';
        ctx.shadowColor = '#FFD166'; ctx.shadowBlur = 18;
        safeText('Elena...', cx, cy - 98);
        ctx.shadowBlur  = 0;
        ctx.font        = '700 24px "Orbitron", sans-serif';
        ctx.fillStyle   = '#FFFFFF';
        ctx.shadowColor = '#FF2E92'; ctx.shadowBlur = 14;
        safeText('¿Quieres ser mi novia?', cx, cy - 58);
        ctx.shadowBlur  = 0;
        ctx.font        = '500 19px "Rajdhani", sans-serif';
        ctx.fillStyle   = '#D8D0FF';
        safeText('— con todo mi cariño, Alex  🦫', cx, cy - 24);

        const pulso = 0.88 + 0.12 * Math.sin(frameContador * 0.1);
        ctx.shadowColor = '#FF2E92'; ctx.shadowBlur = 22 * pulso;
        ctx.fillStyle   = '#FF2E92';
        ctx.beginPath(); ctx.roundRect(cx - 75, cy + 20, 150, 52, 12); ctx.fill();
        // Shimmer en el botón SÍ
        const siBtnShimX = (frameContador * 2.2) % 220 - 30;
        const siShim = ctx.createLinearGradient(cx - 75 + siBtnShimX - 30, cy + 20,
                                                  cx - 75 + siBtnShimX + 30, cy + 20);
        siShim.addColorStop(0, 'rgba(255,255,255,0)');
        siShim.addColorStop(0.5, 'rgba(255,255,255,0.22)');
        siShim.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = siShim;
        ctx.beginPath(); ctx.roundRect(cx - 75, cy + 20, 150, 52, 12); ctx.fill();
        ctx.shadowBlur  = 0;
        ctx.font        = '700 22px "Orbitron", sans-serif';
        ctx.fillStyle   = '#FFFFFF';
        safeText('SÍ  ❤', cx, cy + 53);

        ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 8;
        ctx.fillStyle   = 'rgba(55,55,60,0.78)';
        ctx.strokeStyle = 'rgba(180,180,180,0.18)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.roundRect(btnNoPosX, btnNoPosY, 110, 48, 10); ctx.fill(); ctx.stroke();
        ctx.shadowBlur  = 0;
        ctx.font        = '600 17px "Rajdhani", sans-serif';
        ctx.fillStyle   = '#BBBBBB';
        ctx.fillText('No', btnNoPosX + 55, btnNoPosY + 30);

      // ── CELEBRACION ──
      } else if (estadoCap2 === 'CELEBRACION') {
        dibujarEscenaCamino();

        const bounce = Math.abs(Math.sin(cap2Frame * 0.13)) * 42;
        const ESC    = 0.50;
        dibujarCastorEn3D(cx - 28, horizonY + 10 - bounce,       ESC, -9, false);
        dibujarElena(    cx + 28, horizonY + 10 - bounce * 0.8, ESC);

        corazones.forEach(c => {
          ctx.font      = `${c.size}px serif`;
          ctx.fillStyle = c.color;
          ctx.fillText('❤', c.x, c.y);
        });

        const fi = Math.min(1, cap2Frame / 50);
        ctx.globalAlpha = fi;
        ctx.font        = '900 58px "Orbitron", sans-serif';
        ctx.fillStyle   = '#FF2E92';
        ctx.shadowColor = '#FF2E92'; ctx.shadowBlur = 36;
        ctx.fillText('¡Sí!', cx, cy - 22);
        ctx.shadowBlur  = 0;
        ctx.font        = '600 22px "Rajdhani", sans-serif';
        ctx.fillStyle   = '#FFD166';
        ctx.fillText('Elena  ❤  Alex', cx, cy + 32);
        ctx.globalAlpha = 1;
      }

      ctx.restore();
    }


    // ─── CAPÍTULO 3 ──────────────────────────────────────────────────────────────
    function actualizarCapitulo3() {
      cap3Frame += dt;
      fotoFadeIn = Math.min(1, fotoFadeIn + 0.032 * dt);
      if (estadoCap3 === 'FECHA_FINAL') {
        corazones.forEach(c => {
          c.y += c.vel * dt;
          c.x += Math.sin(frameContador * 0.06 + c.swing) * 0.8 * dt;
          if (c.y > LH + 40) { c.y = -40; c.x = Math.random() * LW; }
        });
      }
    }

    function dibujarCapitulo3() {
      const cx = LW / 2, cy = LH / 2;
      ctx.save();
      ctx.textAlign = 'center';

      // ── FOTOS: carrusel cinematográfico ──────────────────────────────────────
      if (estadoCap3 === 'FOTOS') {
        ctx.fillStyle = '#06040F';
        ctx.fillRect(0, 0, LW, LH);

        const padT = 68, padB = 90;
        const aw = LW - 32, ah = LH - padT - padB;

        // Foto centrada, sin movimiento — el crossfade ya es suficiente animación
        const drawPhoto = (imgIdx, alpha) => {
          const im = imgsCap3[imgIdx];
          if (!im || !im.complete || !im.naturalWidth) return;
          const sc = Math.min(aw / im.naturalWidth, ah / im.naturalHeight);
          const dw = im.naturalWidth  * sc;
          const dh = im.naturalHeight * sc;
          const dx = cx - dw / 2;
          const dy = padT + ah / 2 - dh / 2;
          ctx.globalAlpha = alpha;
          ctx.save();
          ctx.beginPath(); ctx.roundRect(16, padT, aw, ah, 14); ctx.clip();
          ctx.drawImage(im, dx, dy, dw, dh);
          ctx.restore();
        };

        // Foto anterior saliendo (crossfade)
        if (fotoAnterior >= 0 && fotoFadeIn < 0.92) {
          drawPhoto(fotoAnterior, Math.max(0, 1 - fotoFadeIn * 1.25));
        }
        // Foto actual entrando
        drawPhoto(fotoActual, fotoFadeIn);

        // Viñeta cinematográfica (pulsante sutil)
        if (fotoFadeIn > 0.1) {
          const vigPulse = 0.50 + 0.08 * Math.sin(frameContador * 0.04);
          const vig = ctx.createRadialGradient(cx, padT + ah/2, Math.min(aw,ah)*0.22,
                                                cx, padT + ah/2, Math.max(aw,ah)*0.78);
          vig.addColorStop(0, 'rgba(0,0,0,0)');
          vig.addColorStop(1, `rgba(0,0,0,${vigPulse})`);
          ctx.globalAlpha = fotoFadeIn;
          ctx.fillStyle = vig;
          ctx.fillRect(16, padT, aw, ah);
          ctx.globalAlpha = 1;
        }

        // Barras de cine arriba y abajo (letterbox dinámico)
        ctx.fillStyle = '#06040F';
        ctx.fillRect(0, 0, LW, padT);
        ctx.fillRect(0, LH - padB, LW, padB);

        // Puntos de progreso (más grandes y animados)
        for (let i = 0; i < imgsCap3.length; i++) {
          const dotX  = cx + (i - (imgsCap3.length - 1) / 2) * 22;
          const dotY  = LH - 60;
          const isCur = i === fotoActual;
          const pulse = isCur ? 1 + 0.2 * Math.sin(frameContador * 0.12) : 1;
          ctx.beginPath();
          ctx.arc(dotX, dotY, isCur ? 6 * pulse : 3.5, 0, Math.PI * 2);
          ctx.fillStyle = isCur ? '#FF2E92' : 'rgba(255,255,255,0.30)';
          if (isCur) { ctx.shadowColor = '#FF2E92'; ctx.shadowBlur = 10; }
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        // Prompt de toque (pulsante)
        if (fotoFadeIn > 0.55) {
          const pulso = 0.40 + 0.60 * Math.sin(frameContador * 0.08);
          ctx.globalAlpha = pulso * Math.min(1, (fotoFadeIn - 0.55) / 0.35);
          ctx.font      = '600 16px "Rajdhani", sans-serif';
          ctx.fillStyle = '#E8F1FF';
          const label = fotoActual < imgsCap3.length - 1 ? '✦  TOCA PARA CONTINUAR  ✦' : '✦  Y DESPUÉS...  ✦';
          safeText(label, cx, LH - 30);
          ctx.globalAlpha = 1;
        }

      // ── FECHA_INPUT: fondo mientras el overlay DOM es visible ────────────────
      } else if (estadoCap3 === 'FECHA_INPUT') {
        const img = imgsCap3[imgsCap3.length - 1];
        if (img.complete && img.naturalWidth > 0) {
          const s  = Math.max(LW / img.naturalWidth, LH / img.naturalHeight);
          const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
          ctx.globalAlpha = 0.10;
          ctx.drawImage(img, (LW - dw)/2, (LH - dh)/2, dw, dh);
          ctx.globalAlpha = 1;
        }
        ctx.fillStyle = 'rgba(5,3,15,0.85)';
        ctx.fillRect(0, 0, LW, LH);

      // ── FECHA_FINAL: revelación de la fecha oficial ───────────────────────────
      } else if (estadoCap3 === 'FECHA_FINAL') {
        // Fondo degradado oscuro
        const bg = ctx.createLinearGradient(0, 0, 0, LH);
        bg.addColorStop(0, '#07011C');
        bg.addColorStop(1, '#180430');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, LW, LH);

        // Corazones flotantes
        corazones.forEach(c => {
          ctx.globalAlpha = 0.55;
          ctx.font      = `${c.size}px serif`;
          ctx.fillStyle = c.color;
          ctx.fillText('❤', c.x, c.y);
        });
        ctx.globalAlpha = 1;

        // Mini polaroids — centradas, bajadas para no encimarse con el marco HUD
        const thumbs = [0, 2, 4];
        const angles = [-0.09, 0, 0.09];
        const tW = 68, tH = 90, tGap = 10;
        const tCenterY  = 155; // bajadas del borde HUD
        const tStartX   = cx - (tW * thumbs.length + tGap * (thumbs.length-1)) / 2 + tW/2;
        thumbs.forEach((idx, i) => {
          const img = imgsCap3[idx];
          if (!img.complete || !img.naturalWidth) return;
          ctx.save();
          ctx.translate(tStartX + i * (tW + tGap), tCenterY);
          ctx.rotate(angles[i]);
          ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 5;
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath(); ctx.roundRect(-tW/2-4, -tH/2-4, tW+8, tH+8, 4); ctx.fill();
          ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
          const s = Math.min(tW / img.naturalWidth, tH / img.naturalHeight);
          const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
          ctx.save();
          ctx.beginPath(); ctx.rect(-tW/2, -tH/2, tW, tH); ctx.clip();
          ctx.drawImage(img, -dw/2, -dh/2, dw, dh);
          ctx.restore();
          ctx.restore();
        });

        const fi   = Math.min(1, (cap3Frame - 20) / 55);
        if (fi <= 0) { ctx.restore(); return; }
        ctx.globalAlpha = fi;

        // Hoppers dándose un besito
        const topSection = LH * 0.38;
        const approachT  = Math.min(1, cap3Frame / 90);
        const ESC  = 0.52;
        const sep  = 50 - approachT * 16;
        const sway = Math.sin(frameContador * 0.05) * 2;
        dibujarCastorEn3D(cx - sep + sway, topSection, ESC, 0, true);
        dibujarElena(cx + sep - sway, topSection, ESC);
        const hp = 1 + 0.12 * Math.sin(frameContador * 0.18);
        ctx.font = `${Math.round(20 * hp)}px serif`;
        ctx.fillText('❤', cx, topSection - 22);

        // Título "Elena ❤ Alex"
        ctx.font        = '700 22px "Orbitron", sans-serif';
        ctx.fillStyle   = '#FF2E92';
        ctx.shadowColor = '#FF2E92'; ctx.shadowBlur = 16;
        ctx.fillText('Elena  ❤  Alex', cx, topSection + 50);
        ctx.shadowBlur  = 0;

        // Separador
        ctx.globalAlpha = fi * 0.45;
        ctx.strokeStyle = 'rgba(255,46,146,0.6)'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx - 85, topSection + 68); ctx.lineTo(cx + 85, topSection + 68);
        ctx.stroke();
        ctx.globalAlpha = fi;

        // Texto "Oficialmente novios desde el"
        ctx.font      = '500 13px "Rajdhani", sans-serif';
        ctx.fillStyle = 'rgba(200,160,255,0.85)';
        ctx.fillText('OFICIALMENTE NOVIOS DESDE EL', cx, topSection + 90);

        // La fecha: animación pop-in (escala de 0 → 1 con spring suave)
        const fecha      = formatearFecha(fechaNoviazgo);
        const datePopRaw = Math.min(1, (cap3Frame - 25) / 45);
        const datePop    = datePopRaw < 0 ? 0 : 1 - Math.pow(1 - datePopRaw, 3); // ease-out cubic
        const dateScale  = 0.4 + datePop * 0.6;

        if (datePop > 0) {
          ctx.save();
          ctx.globalAlpha = fi * datePop;

          const dayFontSize = Math.min(72, LW * 0.18);
          const dateBaseY   = topSection + 90 + dayFontSize * 1.1;

          // Shimmer en el número del día
          const shimX = (frameContador * 2.8) % (LW + 60) - 30;
          const shim  = ctx.createLinearGradient(shimX - 28, 0, shimX + 28, 0);
          shim.addColorStop(0,   'rgba(255,255,255,0)');
          shim.addColorStop(0.5, 'rgba(255,255,255,0.55)');
          shim.addColorStop(1,   'rgba(255,255,255,0)');

          ctx.translate(cx, dateBaseY);
          ctx.scale(dateScale, dateScale);
          ctx.translate(-cx, -dateBaseY);

          ctx.font        = `900 ${dayFontSize}px "Orbitron", sans-serif`;
          ctx.fillStyle   = '#FFFFFF';
          ctx.shadowColor = '#FFD166'; ctx.shadowBlur = 30;
          ctx.fillText(fecha.dia, cx, dateBaseY);
          // Shimmer overlay
          ctx.shadowBlur  = 0;
          ctx.fillStyle   = shim;
          ctx.fillText(fecha.dia, cx, dateBaseY);

          ctx.font      = '700 20px "Orbitron", sans-serif';
          ctx.fillStyle = '#FFD166';
          ctx.shadowColor = '#FFD166'; ctx.shadowBlur = 10;
          safeText(fecha.mes, cx, dateBaseY + 34);
          ctx.shadowBlur = 0;

          ctx.font      = '600 17px "Rajdhani", sans-serif';
          ctx.fillStyle = 'rgba(200,160,255,0.9)';
          safeText(fecha.anio, cx, dateBaseY + 58);

          ctx.font      = '600 19px "Rajdhani", sans-serif';
          ctx.fillStyle = '#E8D0FF';
          safeText('te quiero mucho  ❤', cx, dateBaseY + 82);

          ctx.restore();
        }

        // Partículas de destello (estrellas pequeñas flotando)
        if (cap3Frame > 30) {
          const nSparks = 12;
          for (let si = 0; si < nSparks; si++) {
            const angle  = (si / nSparks) * Math.PI * 2 + frameContador * 0.012;
            const radius = 55 + 40 * Math.sin(frameContador * 0.04 + si * 0.8);
            const sx = cx + Math.cos(angle) * radius * 1.8;
            const sy = (topSection - 10) + Math.sin(angle) * radius * 0.6;
            const sparkA = (0.3 + 0.7 * Math.sin(frameContador * 0.09 + si)) * fi;
            ctx.globalAlpha = Math.max(0, sparkA);
            ctx.fillStyle   = si % 3 === 0 ? '#FFD166' : si % 3 === 1 ? '#FF2E92' : '#E8D0FF';
            ctx.font        = `${8 + (si % 3) * 4}px serif`;
            ctx.fillText('✦', sx, sy);
          }
          ctx.globalAlpha = fi;
        }

        // Botones: Guardar + Reiniciar lado a lado
        if (cap3Frame > 90) {
          const btnA  = Math.min(1, (cap3Frame - 90) / 30) * fi;
          ctx.globalAlpha = btnA;
          const bW = 130, bH = 44, bGap = 14;
          const bY  = LH - 86;
          const bX1 = cx - bW - bGap / 2;   // Guardar (izq)
          const bX2 = cx + bGap / 2;          // Reiniciar (der)

          // Guardar (pulsa suave)
          const guardPulse = 0.85 + 0.15 * Math.sin(frameContador * 0.08);
          ctx.fillStyle   = `rgba(255,46,146,${0.18 * guardPulse})`;
          ctx.strokeStyle = `rgba(255,46,146,${0.55 * guardPulse})`; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.roundRect(bX1, bY, bW, bH, 10); ctx.fill(); ctx.stroke();
          ctx.font      = '600 14px "Rajdhani", sans-serif';
          ctx.fillStyle = '#FF2E92';
          ctx.shadowColor = '#FF2E92'; ctx.shadowBlur = 8 * guardPulse;
          safeText('Guardar  ⬇', cx - bW/2 - bGap/2, bY + 27);
          ctx.shadowBlur = 0;

          // Reiniciar
          ctx.fillStyle   = 'rgba(30,15,50,0.78)';
          ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.roundRect(bX2, bY, bW, bH, 10); ctx.fill(); ctx.stroke();
          ctx.font      = '600 14px "Rajdhani", sans-serif';
          ctx.fillStyle = 'rgba(255,255,255,0.62)';
          ctx.shadowBlur = 0;
          safeText('Reiniciar', cx + bW/2 + bGap/2, bY + 27);
        }

        ctx.globalAlpha = 1;
      }

      ctx.restore();
    }


    // ─── GAME LOOP ───────────────────────────────────────────────────────────────
    function loopPrueba(now = performance.now()) {
      // Delta-time: escala toda la lógica al tiempo real transcurrido.
      // En 60fps dt≈1, en 30fps dt≈2, así todo corre igual de rápido.
      dt       = lastTime ? Math.min((now - lastTime) / (1000 / 60), 3) : 1;
      lastTime = now;

      ctx.clearRect(0, 0, LW, LH);
      frameContador += dt;

      if (estadoJuego !== 'CAPITULO_3') {
        dibujarCielo();
        dibujarEstrellas();
      }

      if (estadoJuego === 'JUGANDO') {
        velocidadMundo = Math.min(VEL_MUNDO_MAX, VEL_MUNDO_BASE + Math.sqrt(score) * 0.10);
        actualizarFisica();
        actualizarObstaculos();
        score += dt;

        if (detectarColision()) {
          partidasJugadas++;
          localStorage.setItem('hopper_partidas', partidasJugadas);
          if (partidasJugadas >= 5 && !propuestaAceptada) {
            iniciarCapitulo2();
          } else {
            estadoJuego = 'GAME_OVER';
            screenShake  = 9;
            frameContador = 0;
          }
        }
      }

      if (estadoJuego === 'INICIO') {
        nave.y    = (pisoY - NAVE_ALTO) + Math.sin(frameContador * 0.05) * 4;
        nave.velY = 0;
      }

      if (estadoJuego === 'CAPITULO_2') actualizarCapitulo2();
      if (estadoJuego === 'CAPITULO_3') actualizarCapitulo3();

      const enCap = estadoJuego === 'CAPITULO_2' || estadoJuego === 'CAPITULO_3';
      if (!enCap || estadoCap2 === 'INTRO' || estadoCap2 === 'INTRO_CORRE') dibujarPiso();

      if (!enCap) {
        dibujarObstaculos();
        // Líneas de velocidad (aparecen cuando la velocidad es alta)
        if (estadoJuego === 'JUGANDO') {
          const speedT = Math.max(0, (velocidadMundo - VEL_MUNDO_BASE * 1.35) / (VEL_MUNDO_MAX - VEL_MUNDO_BASE * 1.35));
          if (speedT > 0) {
            ctx.save();
            ctx.globalAlpha = speedT * 0.22;
            ctx.strokeStyle = '#E8F1FF';
            ctx.lineWidth = 1;
            const nLines = 8 + Math.floor(speedT * 8);
            for (let li = 0; li < nLines; li++) {
              const lx = (((li * 137 + frameContador * (4 + speedT * 6)) % LW));
              const lLen = 30 + speedT * 60;
              ctx.beginPath();
              ctx.moveTo(lx, LH * (0.05 + (li * 0.11) % 0.85));
              ctx.lineTo(lx - lLen, LH * (0.05 + (li * 0.11) % 0.85));
              ctx.stroke();
            }
            ctx.restore();
          }
        }
        dibujarNave();
      }

      if (estadoJuego === 'JUGANDO' || estadoJuego === 'GAME_OVER') dibujarScore();

      if (estadoJuego === 'INICIO')     dibujarMenuInicio();
      if (estadoJuego === 'GAME_OVER')  dibujarGameOver();
      if (estadoJuego === 'CAPITULO_2') dibujarCapitulo2();
      if (estadoJuego === 'CAPITULO_3') dibujarCapitulo3();

      requestAnimationFrame(loopPrueba);
    }

    ajustarTamano();
    window.addEventListener('resize', ajustarTamano);
    // visualViewport se dispara cuando la barra del nav aparece/desaparece en móvil
    if (window.visualViewport) window.visualViewport.addEventListener('resize', ajustarTamano);
    requestAnimationFrame(loopPrueba);

    // ─── INPUT HANDLERS ───────────────────────────────────────────────────────── //

    canvas.addEventListener('touchstart', function(evento) {
      evento.preventDefault();

      if (estadoJuego === 'CAPITULO_2') {
        // INTRO → tap arranca la corretiza de Hopper
        if (estadoCap2 === 'INTRO' && cap2Frame >= 130) {
          estadoCap2 = 'INTRO_CORRE';
          cap2Frame  = 0;
          return;
        }
        // CAMINO → diálogo intermedio antes de la propuesta
        if (estadoCap2 === 'CAMINO' && cap2Frame >= 535) {
          estadoCap2 = 'DIALOGO_PREVIO';
          cap2Frame  = 0;
          return;
        }
        // DIALOGO_PREVIO → tap botón → PROPUESTA_BOTONES
        if (estadoCap2 === 'DIALOGO_PREVIO' && cap2Frame > 80) {
          const { x: tX, y: tY } = getTouchPos(evento);
          const cx = LW / 2;
          const btnW = 190, btnH = 56;
          const btnX = cx - btnW / 2, btnY = LH * 0.73;
          if (hitRect(tX, tY, btnX, btnY, btnW, btnH, 16)) {
            estadoCap2 = 'PROPUESTA_BOTONES';
            cap2Frame  = 0;
            reposicionarNo();
          }
          return;
        }
        // PROPUESTA_BOTONES → SÍ / NO
        if (estadoCap2 === 'PROPUESTA_BOTONES') {
          const { x: tX, y: tY } = getTouchPos(evento);
          const cx = LW / 2, cy = LH / 2;
          if (hitRect(tX, tY, cx - 75, cy + 20, 150, 52)) {
            iniciarCelebracion();
            return;
          }
          const pad = 24; // generoso para que el NO sea fácil de tocar
          if (hitRect(tX, tY, btnNoPosX, btnNoPosY, 110, 48, pad)) {
            reposicionarNo();
          }
          return;
        }
        return; // bloquea el salto durante el capítulo 2
      }

      // ── CAPÍTULO 3 ──────────────────────────────────────────────────────────
      if (estadoJuego === 'CAPITULO_3') {
        if (estadoCap3 === 'FOTOS') {
          if (fotoActual < imgsCap3.length - 1) {
            fotoAnterior = fotoActual;
            fotoActual++;
            fotoFadeIn = 0;
            cap3Frame  = 0;
          } else {
            estadoCap3 = 'FECHA_INPUT';
            cap3Frame  = 0;
            fechaOverlay.classList.add('visible');
            if (fechaNoviazgo) fechaInput.value = fechaNoviazgo;
          }
          return;
        }
        if (estadoCap3 === 'FECHA_INPUT') return; // DOM overlay lo maneja

        if (estadoCap3 === 'FECHA_FINAL' && cap3Frame > 90) {
          const { x: tX, y: tY } = getTouchPos(evento);
          const cx2 = LW / 2;
          const bW = 130, bH = 44, bGap = 14;
          const bY  = LH - 86;
          const bX1 = cx2 - bW - bGap / 2;
          const bX2 = cx2 + bGap / 2;
          const pad = 12;
          if (hitRect(tX, tY, bX1, bY, bW, bH, pad)) {
            guardarFotoFinal();
          } else if (hitRect(tX, tY, bX2, bY, bW, bH, pad)) {
            forzarAtardecer   = false;
            partidasJugadas   = 0;
            propuestaAceptada = false;
            localStorage.setItem('hopper_partidas', '0');
            localStorage.removeItem('hopper_si');
            estadoCap2   = 'INTRO';
            estadoCap3   = 'FOTOS';
            fotoActual   = 0;
            fotoAnterior = -1;
            fotoFadeIn   = 0;
            reiniciarJuego();
            estadoJuego = 'INICIO';
          }
          return;
        }
        return;
      }

      if (estadoJuego === 'INICIO') {
        nave.y      = pisoY - NAVE_ALTO;
        nave.velY   = 0;
        nave.enPiso = true;
        estadoJuego = 'JUGANDO';
        return;
      }

      if (estadoJuego === 'GAME_OVER') {
        reiniciarJuego();
        return;
      }

      if (nave.enPiso) {
        nave.velY   = IMPULSO_SALTO;
        nave.enPiso = false;
      }
    });
  </script>
